<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>實單 / 模擬單 ROI 報表</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root { --up:#e53935; --down:#2e7d32; --muted:#888; }
  * { box-sizing: border-box; }
  body { font-family: "Microsoft JhengHei", system-ui, sans-serif; margin:0; background:#f5f6f8; color:#222; }
  header { background:#1f2937; color:#fff; padding:14px 20px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; font-weight:600; }
  header .spacer { flex:1; }
  header label { font-size:13px; color:#cbd5e1; }
  header input, header select { padding:5px 8px; border-radius:6px; border:1px solid #475569; background:#0f172a; color:#e2e8f0; font-size:13px; }
  header input { width:100px; }
  button { padding:6px 12px; border:0; border-radius:6px; background:#3b82f6; color:#fff; cursor:pointer; font-size:13px; }
  button:hover { background:#2563eb; }
  .rbtn { background:#334155; color:#e2e8f0; padding:5px 10px; }
  .rbtn.active { background:#ffd33d; color:#1f2937; font-weight:700; }
  .meta { font-size:12px; color:#94a3b8; }
  nav { display:flex; gap:6px; padding:12px 20px 0; }
  nav button { background:#e2e8f0; color:#334155; font-weight:600; }
  nav button.active { background:#3b82f6; color:#fff; }
  main { padding:16px 20px 60px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:10px; margin-bottom:16px; }
  .card { background:#fff; border:1px solid #e5e7eb; border-radius:10px; padding:12px 14px; }
  .card .k { font-size:12px; color:var(--muted); margin-bottom:4px; }
  .card .v { font-size:20px; font-weight:700; }
  .up { color:var(--up); } .down { color:var(--down); } .flat { color:#555; }
  .chartbox { background:#fff; border:1px solid #e5e7eb; border-radius:10px; padding:12px; margin-bottom:16px; }
  .chartbox h3 { margin:0 0 8px; font-size:14px; color:#374151; }
  .canvas-wrap { position:relative; height:340px; }
  .canvas-wrap.sm { height:240px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { padding:6px 8px; border-bottom:1px solid #eee; text-align:right; white-space:nowrap; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align:left; }
  th { background:#f9fafb; color:#6b7280; font-weight:600; position:sticky; top:0; }
  .wrap-table { max-height:420px; overflow:auto; background:#fff; border:1px solid #e5e7eb; border-radius:10px; }
  .empty { text-align:center; color:var(--muted); padding:48px; }
  .notes { background:#fff7ed; border:1px solid #fed7aa; color:#9a3412; padding:8px 12px; border-radius:8px; font-size:13px; margin-bottom:12px; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:900px){ .two { grid-template-columns:1fr; } }
  .segtoggle { display:flex; gap:6px; margin-bottom:14px; }
  .accbtn { background:#334155; color:#e2e8f0; padding:5px 14px; }
  .accbtn.active { background:#ffd33d; color:#1f2937; font-weight:700; }
  .tag { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; font-weight:600; }
  .tag-up { background:#fdecea; color:#c0392b; }
  .tag-down { background:#e8f5e9; color:#2e7d32; }
  .tag-neutral { background:#eef1f4; color:#666; }
</style>
</head>
<body>
<header>
  <h1>實單 / 模擬單 · 投資報酬分析</h1>
  <span class="spacer"></span>
  <label>開始日期 <select id="start"></select></label>
  <label>結束日期 <select id="end"></select></label>
  <span>
    <button class="rbtn" data-n="5">週</button>
    <button class="rbtn" data-n="22">月</button>
    <button class="rbtn" data-n="0">全部</button>
  </span>
  <label>初始本金 <input id="capital" type="number" value="100000" step="10000"></label>
  <button id="reload">套用</button>
  <button id="refresh">重新載入</button>
  <span class="meta" id="meta">載入中…</span>
</header>
<nav>
  <button data-tab="compare" class="active">對照</button>
  <button data-tab="real">實單</button>
  <button data-tab="sim">模擬單</button>
  <button data-tab="records">交易紀錄</button>
</nav>
<main>
  <div id="notes"></div>
  <section id="view-compare"></section>
  <section id="view-real" style="display:none"></section>
  <section id="view-sim" style="display:none"></section>
  <section id="view-records" style="display:none"></section>
</main>

<script>
const STATE = { report:null, charts:[] };
const BCOLOR = {'0050':'#b08800', '00631L':'#8250df'};
const SCOLOR = {real:'#2563eb', sim:'#dc2626'};

function capital(){ const v = parseFloat(document.getElementById('capital').value); return (v>0)?v:100000; }
function fmt(n, d=0){ if(n===null||n===undefined||isNaN(n)) return '—'; return Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function pct(n){ if(n===null||n===undefined||isNaN(n)) return '—'; return (n>0?'+':'')+Number(n).toFixed(2)+'%'; }
function cls(n){ return n>0.0001?'up':(n<-0.0001?'down':'flat'); }
function md(iso){ return iso ? iso.slice(5).replace('-','/') : ''; }
function seriesColor(n){ return n>0?'#dc2626':(n<0?'#2e7d32':'#888'); }

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  ['compare','real','sim','records'].forEach(t=>document.getElementById('view-'+t).style.display = (t===b.dataset.tab)?'':'none');
});

function destroyCharts(){ STATE.charts.forEach(c=>{try{c.destroy();}catch(e){}}); STATE.charts=[]; }
function mkChart(id, cfg){ const el=document.getElementById(id); if(!el) return; STATE.charts.push(new Chart(el, cfg)); }
function baseOpt(yTitle){
  return { responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false},
    plugins:{ legend:{display:false} },
    scales:{ y:{ title:{display:true,text:yTitle} }, x:{ ticks:{maxTicksLimit:12} } } };
}
function lineDs(label, data, color, dash){
  return { label, data, borderColor:color, backgroundColor:color, borderDash:dash||[],
           borderWidth:2, pointRadius:0, tension:0.15, spanGaps:true };
}

function dayIndexOf(iso){
  const days = (STATE.report&&STATE.report.days)||[]; const i = days.indexOf(iso); return i<0?null:i;
}

function currentRange(){
  const days = (STATE.report&&STATE.report.days)||[];
  if(!days.length) return {a:0,b:-1,labels:[],days:[]};
  let a = dayIndexOf(document.getElementById('start').value);
  let b = dayIndexOf(document.getElementById('end').value);
  if(a===null) a=0; if(b===null) b=days.length-1;
  if(a>b){ const t=a; a=b; b=t; }
  const sl = days.slice(a,b+1);
  return {a,b,days:sl,labels:sl.map(md)};
}

// 策略：以區間起點淨值歸零；回傳 {ret, daily, dd, pnlAbs}
function stratRange(m, cap, a, b){
  if(!m || !m.dates || !m.dates.length) return null;
  const realized = m.realized||[], unreal = m.unrealized||[];
  const pnl = realized.map((r,i)=>(r||0)+(unreal[i]||0));
  const seg = pnl.slice(a,b+1);
  if(!seg.length) return null;
  const e0 = cap + seg[0];
  const ret = seg.map(p=> e0 ? +(((cap+p)/e0 - 1)*100).toFixed(4) : 0);
  const eq = seg.map(p=> cap+p);
  const daily = eq.map((x,i)=> i? +(x-eq[i-1]).toFixed(2) : 0);
  let peak=null; const dd = eq.map(e=>{ peak=(peak===null)?e:Math.max(peak,e); return peak? +(((e/peak)-1)*100).toFixed(4):0; });
  return { ret, daily, dd, eq, pnlAbs: seg.map(p=>+p.toFixed(2)) };
}

// 市場：以區間內第一個有效收盤價歸零
function mktRange(code, a, b){
  const mk = (STATE.report.market||{})[code];
  if(!mk || !mk.close) return null;
  const seg = mk.close.slice(a,b+1);
  let base=null; for(const v of seg){ if(v!=null){ base=v; break; } }
  const ret = seg.map(v=> (v!=null && base)? +(((v/base)-1)*100).toFixed(4) : null);
  return { ret, close:seg };
}

function rangeStats(m, cap, a, b){
  const st = stratRange(m, cap, a, b);
  if(!st) return null;
  const days = STATE.report.days;
  const d0 = days[a], d1 = days[b];
  const inRange = d => d>=d0 && d<=d1;
  const closed = (m.closed_trades||[]).filter(t=>inRange(t.date));
  const events = (m.events||[]).filter(e=>inRange(e.date));
  const pcts = closed.map(c=>c.pnl_pct);
  const wins = closed.filter(c=>c.pnl>0), losses = closed.filter(c=>c.pnl<0);
  const gw = wins.reduce((s,c)=>s+c.pnl,0), gl = Math.abs(losses.reduce((s,c)=>s+c.pnl,0));
  const realizedDelta = st.pnlAbs[st.pnlAbs.length-1] - st.pnlAbs[0];
  return {
    ret_pct: st.ret[st.ret.length-1],
    pnl: st.pnlAbs[st.pnlAbs.length-1] - st.pnlAbs[0],
    equity: st.eq[st.eq.length-1],
    realized: +realizedDelta.toFixed(2),
    unrealized: (m.unrealized||[]).length? +(m.unrealized[b]||0).toFixed(2) : 0,
    max_dd: Math.min.apply(null, st.dd),
    n_fills: events.length,
    n_closed: closed.length,
    win_rate: closed.length? +(wins.length/closed.length*100).toFixed(1) : null,
    avg_trade_pct: pcts.length? +(pcts.reduce((s,x)=>s+x,0)/pcts.length).toFixed(2) : null,
    profit_factor: gl>0? +(gw/gl).toFixed(2) : null,
    best: pcts.length? Math.max.apply(null,pcts) : null,
    worst: pcts.length? Math.min.apply(null,pcts) : null,
    closed, strat: st,
  };
}

function load(force){
  const url = './data.json?v=' + (force? Date.now() : (window.__v||(window.__v=Date.now())));
  fetch(url, {cache:'no-store'}).then(r=>r.json()).then(rep=>{
    STATE.report = rep;
    setupSelectors(rep);
    renderAll();
  }).catch(e=>{ document.getElementById('meta').textContent = '載入失敗: '+e; });
}

function setupSelectors(rep){
  const days = rep.days||[];
  const s=document.getElementById('start'), e=document.getElementById('end');
  s.innerHTML = days.map(d=>'<option value="'+d+'">'+d+'</option>').join('');
  e.innerHTML = s.innerHTML;
  if(!days.length) return;
  let a = days.findIndex(d => d >= (rep.market_start||days[0]));
  if(a<0) a=0;
  // 若使用者已選過，沿用
  const prevS = s.dataset.pick, prevE = e.dataset.pick;
  s.value = (prevS && days.includes(prevS)) ? prevS : days[a];
  e.value = (prevE && days.includes(prevE)) ? prevE : days[days.length-1];
  s.dataset.pick = s.value; e.dataset.pick = e.value;
}

function applyQuick(n){
  const days = STATE.report.days||[];
  if(!days.length) return;
  const s=document.getElementById('start'), e=document.getElementById('end');
  const sub = n>0 ? days.slice(-n) : days;
  s.value = sub[0]; e.value = sub[sub.length-1];
  s.dataset.pick=s.value; e.dataset.pick=e.value;
  renderAll();
}

function renderAll(){
  const rep = STATE.report; if(!rep) return;
  destroyCharts();
  renderNotes(rep);
  const {a,b,labels} = currentRange();
  const cap = capital();
  document.getElementById('meta').textContent =
    '資料時間 '+(rep.generated_at||'-')+' ｜ 期間 '+(labels.length?labels[0]+'~'+labels[labels.length-1]:'-')+' ｜ 本金 '+fmt(cap);
  renderCompare(rep, cap, a, b, labels);
  renderMode('real', rep.real, cap, a, b, labels);
  renderMode('sim', rep.sim, cap, a, b, labels);
  renderRecords(rep, cap, a, b, labels);
}

function renderNotes(rep){
  const el=document.getElementById('notes');
  const notes=[].concat(rep.notes||[]);
  if(!(rep.days||[]).length) notes.push('尚無任何市場或交易資料。');
  el.innerHTML = notes.map(n=>'<div class="notes">'+n+'</div>').join('');
}

function metricCards(st){
  if(!st) return '<div class="empty">此區間無資料</div>';
  const items = [
    ['區間報酬', pct(st.ret_pct), cls(st.ret_pct)],
    ['區間損益', fmt(st.pnl), cls(st.pnl)],
    ['淨值', fmt(st.equity), ''],
    ['已實現(區間)', fmt(st.realized), cls(st.realized)],
    ['未實現', fmt(st.unrealized), cls(st.unrealized)],
    ['最大回撤', pct(st.max_dd), st.max_dd<0?'down':'flat'],
    ['平倉筆數', fmt(st.n_closed), ''],
    ['勝率', st.win_rate===null?'—':st.win_rate+'%', ''],
    ['平均每筆', st.avg_trade_pct===null?'—':pct(st.avg_trade_pct), cls(st.avg_trade_pct)],
    ['Profit Factor', st.profit_factor===null?'—':st.profit_factor, ''],
    ['最佳/最差', (st.best==null?'—':pct(st.best))+' / '+(st.worst==null?'—':pct(st.worst)), ''],
  ];
  return '<div class="cards">'+items.map(([k,v,c])=>
    '<div class="card"><div class="k">'+k+'</div><div class="v '+c+'">'+v+'</div></div>').join('')+'</div>';
}

function renderCompare(rep, cap, a, b, labels){
  const v = document.getElementById('view-compare');
  const realSt = rangeStats(rep.real, cap, a, b);
  const simSt  = rangeStats(rep.sim,  cap, a, b);
  v.innerHTML =
    '<div class="two">'+
      '<div><h3 style="margin:0 0 8px;color:#2563eb">實單</h3>'+metricCards(realSt)+'</div>'+
      '<div><h3 style="margin:0 0 8px;color:#dc2626">模擬單</h3>'+metricCards(simSt)+'</div>'+
    '</div>'+
    '<div class="chartbox"><h3>累積總報酬 %（以區間第一天為 0）— 實單 vs 模擬單 vs 0050 vs 00631L</h3>'+
      '<div class="canvas-wrap"><canvas id="c-cmp"></canvas></div></div>';

  const datasets=[];
  if(realSt) datasets.push(lineDs('實單', realSt.strat.ret, SCOLOR.real));
  if(simSt)  datasets.push(lineDs('模擬單', simSt.strat.ret, SCOLOR.sim));
  Object.keys(rep.market||{}).forEach(code=>{
    const mk = mktRange(code, a, b);
    if(mk) datasets.push(lineDs((rep.market[code].label||code), mk.ret, BCOLOR[code]||'#999', [6,4]));
  });
  mkChart('c-cmp', { type:'line',
    data:{ labels, datasets },
    options:{ responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false},
      plugins:{ legend:{position:'top'} },
      scales:{ y:{ title:{display:true,text:'報酬 %'} }, x:{ ticks:{maxTicksLimit:12} } } } });
}

function histogram(pcts){
  const bins=[-20,-15,-10,-5,-2,0,2,5,10,15,20,30];
  const counts=new Array(bins.length-1).fill(0); const labels=[];
  for(let i=0;i<bins.length-1;i++) labels.push(bins[i]+'~'+bins[i+1]+'%');
  pcts.forEach(p=>{ let idx=counts.length-1; for(let i=0;i<bins.length-1;i++){ if(p>=bins[i]&&p<bins[i+1]){idx=i;break;} } counts[idx]++; });
  return {labels,counts};
}

function renderMode(key, m, cap, a, b, labels){
  const v = document.getElementById('view-'+key);
  const st = rangeStats(m, cap, a, b);
  if(!st){
    v.innerHTML = '<div class="empty">尚無'+ (key==='real'?'實單':'模擬單') +'交易紀錄</div>';
    return;
  }
  const hist = histogram(st.closed.map(t=>t.pnl_pct));
  v.innerHTML =
    metricCards(st)+
    '<div class="chartbox"><h3>累積報酬 %（以區間第一天為 0）</h3>'+
      '<div class="canvas-wrap"><canvas id="c-'+key+'-ret"></canvas></div></div>'+
    '<div class="two">'+
      '<div class="chartbox"><h3>每日損益（元）</h3><div class="canvas-wrap sm"><canvas id="c-'+key+'-daily"></canvas></div></div>'+
      '<div class="chartbox"><h3>回撤 %</h3><div class="canvas-wrap sm"><canvas id="c-'+key+'-dd"></canvas></div></div>'+
    '</div>'+
    '<div class="chartbox"><h3>每筆平倉報酬分布</h3><div class="canvas-wrap sm"><canvas id="c-'+key+'-hist"></canvas></div></div>'+
    tableHtml(st.closed);

  mkChart('c-'+key+'-ret', { type:'line',
    data:{ labels, datasets:[ lineDs('報酬%', st.strat.ret, SCOLOR[key]) ]}, options:baseOpt('%') });
  mkChart('c-'+key+'-daily', { type:'bar',
    data:{ labels, datasets:[{ label:'每日損益', data:st.strat.daily, backgroundColor:st.strat.daily.map(seriesColor) }]},
    options:baseOpt('元') });
  mkChart('c-'+key+'-dd', { type:'line',
    data:{ labels, datasets:[ lineDs('回撤', st.strat.dd, '#ef4444') ]}, options:baseOpt('%') });
  mkChart('c-'+key+'-hist', { type:'bar',
    data:{ labels:hist.labels, datasets:[{ label:'筆數', data:hist.counts, backgroundColor:'#3b82f6' }]},
    options:baseOpt('筆數') });
}

let recordsKey = 'real';

function recordsToggleHtml(){
  const b = k => '<button class="accbtn'+(recordsKey===k?' active':'')+'" data-acc="'+k+'">'+((STATE.report&&STATE.report[k])?STATE.report[k].label:k)+'</button>';
  return '<div class="segtoggle">'+b('real')+b('sim')+'</div>';
}

function positionsTable(positions){
  if(!positions || !positions.length) return '<div class="chartbox"><h3>目前持倉</h3><div class="empty">目前無持倉</div></div>';
  return '<div class="chartbox"><h3>目前持倉（最新）</h3><div class="wrap-table"><table>'+
    '<thead><tr><th>股票</th><th>代號</th><th>股數</th><th>均價</th><th>現價</th><th>市值</th><th>損益</th></tr></thead><tbody>'+
    positions.map(p=>{
      const px = (p.last_price!=null ? p.last_price : p.avg_cost);
      const mv = px*p.shares;
      return '<tr><td>'+p.name+'</td><td>'+p.code+'</td><td>'+fmt(p.shares)+'</td><td>'+fmt(p.avg_cost,2)+
        '</td><td>'+fmt(px,2)+'</td><td>'+fmt(mv)+'</td><td class="'+cls(p.unrealized)+'">'+fmt(p.unrealized)+'</td></tr>';
    }).join('')+'</tbody></table></div></div>';
}

function resultTag(e){
  if(e.action !== 'sell') return '<span class="tag tag-neutral">進場</span>';
  if(Math.round(e.realized) === 0) return '<span class="tag tag-neutral">平</span>';
  return e.realized > 0 ? '<span class="tag tag-up">賺</span>' : '<span class="tag tag-down">賠</span>';
}

function eventsTable(events){
  if(!events || !events.length) return '<div class="chartbox"><h3>交易紀錄</h3><div class="empty">此區間無交易紀錄</div></div>';
  const rows = events.map(e=>{
    const isBuy = e.action==='buy';
    const time = e.ts ? e.ts.slice(5,16).replace('T',' ') : e.date;
    const pnl = isBuy ? '<td class="flat">—</td>'
      : '<td class="'+cls(e.realized)+'">'+fmt(e.realized)+(e.pnl_pct!=null?' <span style="font-size:.85em">('+pct(e.pnl_pct)+')</span>':'')+'</td>';
    const title = e.reason ? ' title="'+e.reason+'"' : '';
    return '<tr'+title+'><td>'+time+'</td><td>'+resultTag(e)+'</td><td>'+e.name+'</td><td>'+e.code+'</td>'+
      '<td>'+(isBuy?'買':'賣')+'</td><td>'+fmt(e.shares)+'</td><td>'+fmt(e.price,2)+'</td>'+
      '<td>'+fmt(e.amount)+'</td><td>'+fmt(e.fee+e.tax)+'</td>'+pnl+'</tr>';
  }).join('');
  return '<div class="chartbox"><h3>交易紀錄（逐筆成交，'+events.length+' 筆）</h3><div class="wrap-table"><table>'+
    '<thead><tr><th>時間</th><th>賺賠</th><th>股票</th><th>代號</th><th>買賣</th><th>股數</th><th>價格</th><th>金額</th><th>費+稅</th><th>損益</th></tr></thead><tbody>'+
    rows+'</tbody></table></div></div>';
}

function renderRecords(rep, cap, a, b, labels){
  const v = document.getElementById('view-records');
  const m = rep[recordsKey] || {};
  const st = rangeStats(m, cap, a, b);
  const days = rep.days || [];
  const d0 = days[a], d1 = days[b];
  const inRange = d => d>=d0 && d<=d1;
  const events = (m.events||[]).filter(e=>inRange(e.date)).slice().reverse();
  const positions = m.open_positions || [];
  const mktVal = positions.reduce((s,p)=> s + ((p.last_price!=null?p.last_price:p.avg_cost)*p.shares), 0);
  const cards = [
    ['區間總損益', st?fmt(st.pnl):'—', st?cls(st.pnl):''],
    ['已實現(區間)', st?fmt(st.realized):'—', st?cls(st.realized):''],
    ['未實現', st?fmt(st.unrealized):'—', st?cls(st.unrealized):''],
    ['持倉市值', fmt(mktVal), ''],
    ['持倉檔數', fmt(positions.length), ''],
    ['勝率(區間)', (st&&st.win_rate!=null)?st.win_rate+'%':'—', ''],
    ['平倉筆數(區間)', st?fmt(st.n_closed):'—', ''],
  ];
  const cardsHtml = '<div class="cards">'+cards.map(([k,val,c])=>
    '<div class="card"><div class="k">'+k+'</div><div class="v '+c+'">'+val+'</div></div>').join('')+'</div>';
  v.innerHTML = recordsToggleHtml() + cardsHtml + positionsTable(positions) + eventsTable(events);
  v.querySelectorAll('button[data-acc]').forEach(btn=>btn.onclick=()=>{
    recordsKey = btn.dataset.acc; renderRecords(rep, cap, a, b, labels);
  });
}

function tableHtml(closed){
  const rows=(closed||[]).slice().reverse();
  if(!rows.length) return '<div class="empty">此區間無平倉紀錄</div>';
  return '<div class="chartbox"><h3>平倉明細（'+rows.length+' 筆）</h3><div class="wrap-table"><table>'+
    '<thead><tr><th>日期</th><th>代號 名稱</th><th>股數</th><th>買均</th><th>賣價</th><th>費+稅</th><th>損益</th><th>報酬%</th></tr></thead><tbody>'+
    rows.map(t=>'<tr><td>'+t.date+'</td><td>'+t.code+' '+t.name+'</td><td>'+fmt(t.shares)+
      '</td><td>'+fmt(t.avg_cost,2)+'</td><td>'+fmt(t.sell_price,2)+
      '</td><td>'+fmt(t.fee+t.tax,0)+'</td><td class="'+cls(t.pnl)+'">'+fmt(t.pnl)+
      '</td><td class="'+cls(t.pnl_pct)+'">'+pct(t.pnl_pct)+'</td></tr>').join('')+
    '</tbody></table></div></div>';
}

document.getElementById('capital').value = localStorage.getItem('roi_capital') || '100000';
document.getElementById('start').addEventListener('change', e=>{ e.target.dataset.pick=e.target.value; renderAll(); });
document.getElementById('end').addEventListener('change', e=>{ e.target.dataset.pick=e.target.value; renderAll(); });
document.querySelectorAll('.rbtn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.rbtn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); applyQuick(Number(b.dataset.n));
});
document.getElementById('reload').onclick = ()=>{
  localStorage.setItem('roi_capital', document.getElementById('capital').value||'100000'); renderAll();
};
document.getElementById('refresh').onclick = ()=>load(true);

load(false);
</script>
</body>
</html>
